name: Intermediate Workflow
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Super-linter
        uses: super-linter/super-linter@v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/plycos/java-demo
          tags: |
            latest

      - name: Restore Maven Cache
        id: m2-cache
        uses: actions/cache@v6
        with:
          path: m2-cache
          key: m2-cache-${{ hashFiles('pom.xml') }}
          restore-keys: |
            m2-cache-

      - name: Inject Maven cache into Docker build
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: m2-cache
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.m2-cache.outputs.cache-hit }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
